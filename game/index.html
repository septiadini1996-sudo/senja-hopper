<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senja Hopper — Nusantara Island Deliveries</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f1e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Senja Hopper: a seaplane delivery game over the Indonesian archipelago. Plan a route on the map, then fly the leg: throttle, pitch, wind, storm cells, fuel and a runway landing at the destination island."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
